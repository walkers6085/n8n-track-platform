services:
  backend:
    image: python:3.11-slim
    container_name: track-platform
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir -r backend/requirements.txt &&
               uvicorn backend.main:app --host 0.0.0.0 --port 19001"
    ports:
      - "19001:19001"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./tracks:/app/tracks
      - ./track_versions:/app/track_versions
      - ./runs:/app/runs
      - ./users:/app/users
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      # Fallback agent key when none is set in the analyst settings; optional analyst protection.
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - ANALYST_TOKEN=${ANALYST_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
